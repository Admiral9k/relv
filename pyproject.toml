[project]
name = "relv"
version = "1.1.0"
description = "Relevator — profile-grounded relevance triage + adjacency mining for the tool/article firehose"
readme = "README.md"
license = "MIT"
authors = [{ name = "Devon" }]
keywords = ["triage", "ai-tools", "research", "adjacency", "profile-grounded", "firehose", "agent-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Admiral9k/relv"
Repository = "https://github.com/Admiral9k/relv"

[project.optional-dependencies]
ui = ["pywebview>=5.0"]

[project.scripts]
relv = "relv.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relv"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/docs", "/examples", "/profile-generator-prompt.md"]